<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/lore-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plus de 1 100 lieux mythiques à conquérir. Ta carte du monde s'allume, tes voyages se rejouent en film, et tu défies tes amis. Gratuit, sans inscription.">

  <!--
    Aperçu du lien (WhatsApp, iMessage, DM Instagram, X, LinkedIn…). Sans ces
    balises, un lien partagé s'affichait nu : ni titre ni image, deux fois
    moins de clics. Les robots ne lisent pas le JavaScript : l'aperçu est
    statique, le même pour un lien de défi. Adresses ABSOLUES obligatoires —
    à mettre à jour si Lore change de domaine.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lore">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:url" content="https://iris-automation.github.io/lore-web/">
  <meta property="og:title" content="Lore — ta carte du monde, rejouée en film">
  <meta property="og:description" content="Plus de 1 100 lieux mythiques à conquérir. Ta carte s'allume, tu défies tes amis. Gratuit, sans inscription.">
  <meta property="og:image" content="https://iris-automation.github.io/lore-web/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Une carte du monde allumée pays par pays : 126 lieux conquis, 55 pays, 6 continents.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Lore — ta carte du monde, rejouée en film">
  <meta name="twitter:description" content="Plus de 1 100 lieux mythiques à conquérir. Ta carte s'allume, tu défies tes amis.">
  <meta name="twitter:image" content="https://iris-automation.github.io/lore-web/og.jpg">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lore">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lore — Écris ta légende</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F7F8F7">

  <!--
    Écran d'attente en HTML pur, visible dès les premiers octets.

    Flutter ne peut rien afficher tant que son moteur (2 Mo) et le code de
    l'app ne sont pas arrivés : sur une 4G moyenne, cela faisait près de
    dix secondes de page blanche au premier lancement — de quoi croire
    l'app cassée. Cet écran reprend exactement celui de Flutter (blason,
    titre, sous-titre), si bien que le passage de l'un à l'autre ne se voit
    pas. Il est retiré à la première image peinte par Flutter.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #F7F8F7; }
    #lore-attente {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #F7F8F7; color: #17262E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .25s ease;
    }
    #lore-attente.parti { opacity: 0; pointer-events: none; }
    #lore-attente svg { width: 108px; height: 108px; }
    #lore-attente h1 { margin: 26px 0 0; font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
    #lore-attente p { margin: 8px 0 0; font-size: 14px; letter-spacing: 1px; color: #17262EB0; }
    #lore-attente .fil { margin-top: 30px; width: 96px; height: 3px; border-radius: 2px;
      background: #FF5A3C22; overflow: hidden; }
    #lore-attente .fil::after { content: ""; display: block; width: 40%; height: 100%;
      border-radius: 2px; background: #FF5A3C; animation: lore-fil 1.1s ease-in-out infinite; }
    @keyframes lore-fil { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #lore-attente .fil::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="lore-attente" role="status" aria-label="Chargement de Lore">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g transform="rotate(45 50 50)">
        <path d="M50 9.375 L38.28 50 L50 90.625 Z" fill="#D93E22"/>
        <path d="M50 9.375 L61.72 50 L50 90.625 Z" fill="#FF5A3C"/>
      </g>
    </svg>
    <h1>Lore</h1>
    <p>Écris ta légende.</p>
    <div class="fil"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var e = document.getElementById('lore-attente');
      if (!e) return;
      e.classList.add('parti');
      setTimeout(function () { e.remove(); }, 300);
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Enregistrement du service worker, fait à la main.

    Le chargeur de Flutter ne s'en charge plus que si une inscription existe
    DÉJÀ (son propre service worker est déprécié) : un nouvel utilisateur
    n'en obtenait donc jamais, et l'app retéléchargeait ~7 Mo à chaque
    lancement — et refusait de s'ouvrir sans réseau.

    `1de90f795d28` est remplacé par l'empreinte du build (voir
    tool/finaliser_web.sh) : c'est elle qui purge le cache au déploiement.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('flutter_service_worker.js?v=1de90f795d28')
          .catch(function (e) {
            console.warn('Service worker non enregistré :', e);
          });
      });

      // Une fois l'app affichée, on signale au worker les fichiers du moteur
      // réellement chargés (WebAssembly ou JavaScript, selon le navigateur) :
      // il les range pour que Lore s'ouvre ensuite sans réseau. Ils arrivent
      // avant que le worker ne prenne la main, il ne les voit donc pas passer.
      //
      // Le message va au worker de LA MÊME version que cette page. Sur un vrai
      // réseau, le nouveau worker finit souvent de s'installer après le
      // premier affichage : l'ancien recevait le message et l'ignorait, et le
      // moteur ne rejoignait jamais le cache. On attend donc qu'il prenne la
      // main (`controllerchange`).
      function signalerMoteur() {
        var worker = navigator.serviceWorker.controller;
        if (!worker || worker.scriptURL.indexOf('v=1de90f795d28') < 0) {
          return false;
        }
        var urls = performance.getEntriesByType('resource')
          .map(function (e) { return e.name; })
          .filter(function (u) {
            return /\/(main\.dart\.(js|mjs|wasm)|canvaskit\/.+\.(js|wasm))$/.test(u);
          });
        worker.postMessage({type: 'moteur', version: '1de90f795d28', urls: urls});
        return true;
      }
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(function () {
          if (signalerMoteur()) return;
          navigator.serviceWorker.addEventListener('controllerchange',
            function attendre() {
              if (signalerMoteur()) {
                navigator.serviceWorker.removeEventListener(
                  'controllerchange', attendre);
              }
            });
        }, 3000);
      });
    }
  </script>
</body>
</html>
