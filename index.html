<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/lore-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lore — carnet de voyage héroïque. Conquiers les lieux du patrimoine mondial, 100% hors-ligne.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lore">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lore — Écris ta légende</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F7F8F7">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Enregistrement du service worker, fait à la main.

    Le chargeur de Flutter ne s'en charge plus que si une inscription existe
    DÉJÀ (son propre service worker est déprécié) : un nouvel utilisateur
    n'en obtenait donc jamais, et l'app retéléchargeait ~7 Mo à chaque
    lancement — et refusait de s'ouvrir sans réseau.

    `826c377731fd` est remplacé par l'empreinte du build (voir
    tool/finaliser_web.sh) : c'est elle qui purge le cache au déploiement.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('flutter_service_worker.js?v=826c377731fd')
          .catch(function (e) {
            console.warn('Service worker non enregistré :', e);
          });
      });
    }
  </script>
</body>
</html>
